<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#1F8A70">
  <title>校园AI助手 · 校园优购</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <style type="text/css">
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .chat-header {
      flex: none;
      height: 52px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 12px;
    }

    .chat-header .back {
      width: 32px;
      font-size: 20px;
      color: var(--text);
      cursor: pointer;
    }

    .chat-header .title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .title span {
      display: block;
      font-size: 10px;
      font-weight: 400;
      color: var(--primary);
      line-height: 1.2;
      margin-top: -2px;
    }

    .chat-header .placeholder {
      width: 32px;
      text-align: center;
      font-size: 17px;
      color: var(--muted);
      cursor: pointer;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 8px;
    }

    .msg {
      display: flex;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .avatar {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .msg.assistant .avatar {
      background: linear-gradient(135deg, #2AA986, var(--primary));
      color: #fff;
      margin-right: 8px;
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .msg.user .avatar {
      background: var(--accent);
      color: #fff;
      margin-left: 8px;
    }

    .msg .bubble {
      max-width: 76%;
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      box-shadow: var(--shadow);
    }

    .msg.user .bubble {
      background: var(--primary);
      color: #fff;
      border-top-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--card);
      color: var(--text);
      border-top-left-radius: 4px;
    }

    .msg.error .bubble {
      background: #FDECEA;
      color: #B00020;
      border: 1px solid #F5C6CB;
      box-shadow: none;
    }

    .msg .loading-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 4px;
      background: var(--primary);
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .msg .loading-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .msg .loading-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .25 }
      40% { opacity: 1 }
    }

    /* 快捷提问 */
    .quick-list {
      flex: none;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      scrollbar-width: none;
    }

    .quick-list::-webkit-scrollbar {
      display: none;
    }

    .quick-chip {
      flex: none;
      font-size: 12px;
      line-height: 30px;
      padding: 0 14px;
      border-radius: 15px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--primary);
      cursor: pointer;
      white-space: nowrap;
    }

    .quick-chip:active {
      background: var(--primary-soft);
    }

    .chat-input {
      flex: none;
      background: var(--card);
      border-top: 1px solid var(--line);
      padding: 8px 12px;
      display: flex;
      align-items: center;
    }

    .chat-input .el-input {
      flex: 1;
    }

    .chat-input .el-input__inner {
      border-radius: 20px;
      background: #F2F5F4;
      border-color: transparent;
    }

    .chat-input .send-btn {
      margin-left: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 18px;
      padding: 0 18px;
      height: 34px;
      font-size: 13px;
      cursor: pointer;
    }

    .chat-input .send-btn:disabled {
      background: #C4CBC8;
      cursor: not-allowed;
    }

    .chat-tip {
      flex: none;
      text-align: center;
      font-size: 10px;
      color: #A9B2AF;
      padding: 0 0 8px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="chat-header">
    <div class="back" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="title">校园AI助手<span>基于校园店铺数据回答问题</span></div>
    <div class="placeholder" v-if="messages.length" @click="clearHistory"><i class="el-icon-delete"></i></div>
    <div class="placeholder" v-else></div>
  </div>

  <div class="chat-list" ref="list">
    <div class="msg assistant">
      <div class="avatar"><i class="el-icon-magic-stick"></i></div>
      <div class="bubble">你好呀，我是校园优购的 AI 助手 🌿
可以问我：食堂有什么推荐？哪家打印店便宜？现在去哪自习人少？</div>
    </div>
    <div class="msg" v-for="(m, i) in messages" :key="i" :class="m.role + (m.error ? ' error' : '')">
      <div class="avatar">
        <i :class="m.role === 'user' ? 'el-icon-user' : 'el-icon-magic-stick'"></i>
      </div>
      <div class="bubble">{{ m.content }}</div>
    </div>
    <div class="msg assistant" v-if="loading">
      <div class="avatar"><i class="el-icon-magic-stick"></i></div>
      <div class="bubble loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="quick-list" v-if="!messages.length && !loading">
    <div class="quick-chip" v-for="q in quickQuestions" :key="q" @click="ask(q)">{{q}}</div>
  </div>

  <div class="chat-input">
    <el-input v-model="input" placeholder="问问校园里的事…" @keyup.enter.native="send" :disabled="loading"></el-input>
    <button class="send-btn" @click="send" :disabled="loading || !input.trim()">发送</button>
  </div>
  <div class="chat-tip">回答由 AI 生成，仅供参考</div>
</div>

<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  new Vue({
    el: "#app",
    data: {
      input: "",
      messages: [],
      loading: false,
      quickQuestions: [
        "食堂有什么好吃的推荐？",
        "哪里打印最便宜？",
        "现在去哪自习人少？"
      ]
    },
    created() {
      // 页面刷新/退出再进来时恢复记录：只在当前标签页内有效，关掉标签页就清空
      try {
        const saved = JSON.parse(sessionStorage.getItem("chat:history") || "[]");
        if (Array.isArray(saved)) this.messages = saved;
      } catch (e) {
        sessionStorage.removeItem("chat:history");
      }
      this.scrollBottom();
    },
    methods: {
      goBack() {
        history.back();
      },
      saveHistory() {
        // 只留最近 20 条，避免 sessionStorage 越存越大
        sessionStorage.setItem("chat:history", JSON.stringify(this.messages.slice(-20)));
      },
      clearHistory() {
        this.messages = [];
        sessionStorage.removeItem("chat:history");
      },
      scrollBottom() {
        this.$nextTick(() => {
          const el = this.$refs.list;
          if (el) el.scrollTop = el.scrollHeight;
        });
      },
      ask(q) {
        this.input = q;
        this.send();
      },
      send() {
        const question = this.input.trim();
        if (!question || this.loading) return;
        // 先把之前的对话取出来一起发给后端，模型才能接住追问
        const history = this.messages
          .filter(m => !m.error)
          .slice(-6)
          .map(m => ({role: m.role, content: m.content}));
        this.input = "";
        this.messages.push({role: "user", content: question});
        this.saveHistory();
        this.scrollBottom();
        this.loading = true;
        // 覆盖 common.js 默认 2s 超时：大模型生成要几十秒
        axios.post("/chat", {question, history}, {timeout: 60000})
          .then(res => {
            this.messages.push({role: "assistant", content: res.data});
            this.saveHistory();
          })
          .catch(err => {
            const tip = typeof err === "string" ? err : "服务器异常，请稍后再试";
            this.messages.push({role: "assistant", content: tip, error: true});
            this.saveHistory();
          })
          .finally(() => {
            this.loading = false;
            this.scrollBottom();
          });
      }
    }
  })
</script>
</body>
</html>
