<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#1F8A70">
  <title>校园优购</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/shop-list.css" rel="stylesheet">
  <link href="./css/main.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">{{typeName}}</div>
    <div class="header-search" @click="toggleSearch">
      <i :class="showSearch ? 'el-icon-close' : 'el-icon-search'"></i>
    </div>
  </div>

  <div class="search-row" v-if="showSearch">
    <el-input v-model="keyword" size="small" placeholder="搜店铺、地址" clearable prefix-icon="el-icon-search"></el-input>
    <span class="search-cancel" @click="toggleSearch">取消</span>
  </div>

  <div class="sort-bar">
    <div class="sort-item">
      <el-dropdown trigger="click" @command="handleCommand">
        <span class="el-dropdown-link">
          {{typeName}}<i class="el-icon-arrow-down el-icon--right"></i>
        </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
    <div class="sort-item" :class="{active: params.sortBy === ''}" @click="sortAndQuery('')">距离</div>
    <div class="sort-item" :class="{active: params.sortBy === 'comments'}" @click="sortAndQuery('comments')">人气</div>
    <div class="sort-item" :class="{active: params.sortBy === 'score'}" @click="sortAndQuery('score')">评分</div>
  </div>

  <div class="shop-list" @scroll="onScroll">
    <div class="shop-box" v-for="s in filteredShops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img"><img :src="s.images" alt=""></div>
      <div class="shop-info">
        <div class="shop-title shop-item">{{s.name}}</div>
        <div class="shop-rate shop-item">
          <el-rate
              disabled v-model="s.score/10"
              text-color="#F4A261"
              show-score
          ></el-rate>
          <span>{{s.comments}}条评价</span>
        </div>
        <div class="shop-area shop-item">
          <span>{{s.area}}</span>
          <span v-if="s.distance">{{formatDistance(s.distance)}}</span>
        </div>
        <div class="shop-avg shop-item">
          <template v-if="s.avgPrice > 0">￥{{s.avgPrice}}/人</template>
          <template v-else>免费</template>
        </div>
        <div class="shop-address shop-item">
          <i class="el-icon-map-location"></i>
          <span>{{s.address}}</span>
        </div>
      </div>
    </div>
    <div class="list-empty" v-if="!filteredShops.length && loaded">没有找到相关店铺</div>
    <div class="list-empty" v-else-if="!filteredShops.length">加载中...</div>
  </div>

  <div class="ai-fab" @click="goChat">
    <i class="el-icon-chat-line-round"></i>
    <span>AI助手</span>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      loaded: false,
      showSearch: false,
      keyword: "",
      types: [],
      shops: [],
      typeName: "",
      params: {
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 112.9901, // 星城大学东校区 经度
        y: 28.1801   // 纬度
      }
    },
    computed: {
      filteredShops() {
        const kw = this.keyword.trim();
        if (!kw) return this.shops;
        return this.shops.filter(s =>
          (s.name && s.name.indexOf(kw) > -1) ||
          (s.address && s.address.indexOf(kw) > -1) ||
          (s.area && s.area.indexOf(kw) > -1)
        );
      }
    },
    created() {
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name") || "全部店铺";
      this.queryTypes();
      this.queryShops();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => this.$message.error(err))
      },
      queryShops() {
        axios.get("/shop/of/type", {
          params: this.params
        })
          .then(({data}) => {
            this.loaded = true;
            if (!data) {
              return
            }
            data.forEach(s => s.images = s.images.split(',')[0]);
            this.shops = this.shops.concat(data);
          })
          .catch(err => {
            this.loaded = true;
            this.$message.error(err)
          })
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type=" + t.id + "&name=" + encodeURIComponent(t.name);
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        this.params.current = 1;
        this.shops = [];
        this.isReachBottom = false;
        this.queryShops();
      },
      formatDistance(d) {
        return d < 1000 ? d.toFixed(0) + "m" : (d / 1000).toFixed(1) + "km";
      },
      toggleSearch() {
        this.showSearch = !this.showSearch;
        if (!this.showSearch) this.keyword = "";
      },
      goBack() {
        history.back();
      },
      goChat() {
        location.href = "/chat.html";
      },
      toDetail(id) {
        location.href = "/shop-detail.html?id=" + id
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop + offsetHeight + 1 > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true;
          this.params.current++;
          this.queryShops();
        } else {
          this.isReachBottom = false
        }
      },
    }
  })
</script>
</body>
</html>
