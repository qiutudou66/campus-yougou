<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#1F8A70">
  <title>校园优购</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">登录</div>
    </div>
    <div class="content">
      <div class="login-brand">
        <div class="brand-logo"><i class="el-icon-shopping-bag-1"></i></div>
        <div class="brand-name">校园优购</div>
        <div class="brand-sub">星城大学 · 校园生活点评</div>
      </div>

      <div class="login-form">
        <div style="display: flex; gap: 10px; align-items: flex-start;">
          <el-input style="flex: 1" placeholder="请输入手机号" v-model="form.phone" maxlength="11"></el-input>
          <el-button class="code-btn" style="width: 42%" @click="sendCode" :disabled="disabled">{{codeBtnMsg}}</el-button>
        </div>
        <el-input placeholder="请输入验证码" v-model="form.code" maxlength="6"></el-input>
        <div class="form-tip">未注册的手机号验证后将自动创建账号</div>
        <el-button class="login-btn" @click="login">登录 / 注册</el-button>
        <div class="form-link"><a href="/login2.html">使用密码登录 ›</a></div>
      </div>

      <div class="login-radio">
        <div>
          <input type="radio" id="readed" name="readed" v-model="radio" value="1">
          <label for="readed"></label>
        </div>
        <div>我已阅读并同意
          <a href="javascript:void(0)">《校园优购用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      disabled: false,
      codeBtnMsg: "发送验证码",
      form: {}
    },
    methods: {
      login() {
        if (!this.radio) {
          this.$message.error("请先确认阅读用户协议！");
          return
        }
        if (!this.form.phone || !this.form.code) {
          this.$message.error("手机号和验证码不能为空！");
          return
        }
        axios.post("/user/login", this.form)
          .then(({data}) => {
            if (data) {
              sessionStorage.setItem("token", data);
            }
            location.href = "/index.html"
          })
          .catch(err => this.$message.error(err))
      },
      goBack() {
        history.back();
      },
      sendCode() {
        if (!this.form.phone) {
          this.$message.error("手机号不能为空");
          return;
        }
        axios.post("/user/code?phone=" + this.form.phone)
          .then(() => {})
          .catch(err => this.$message.error(err));
        this.disabled = true;
        let i = 60;
        this.codeBtnMsg = (i--) + '秒后可重发'
        let taskId = setInterval(() => this.codeBtnMsg = (i--) + '秒后可重发', 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "发送验证码";
        }, 59000)
      }
    }
  })
</script>
</body>
</html>
