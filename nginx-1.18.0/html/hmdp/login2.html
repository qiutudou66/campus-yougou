<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#1F8A70">
  <title>校园优购</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack"><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">密码登录</div>
    </div>
    <div class="content">
      <div class="login-brand">
        <div class="brand-logo"><i class="el-icon-shopping-bag-1"></i></div>
        <div class="brand-name">校园优购</div>
        <div class="brand-sub">星城大学 · 校园生活点评</div>
      </div>

      <div class="login-form">
        <el-input placeholder="请输入手机号" v-model="form.phone" maxlength="11"></el-input>
        <el-input placeholder="请输入密码" v-model="form.password" show-password></el-input>
        <div class="form-tip"><a href="javascript:void(0)" style="color: var(--muted)">忘记密码？</a></div>
        <el-button class="login-btn" @click="login">登录</el-button>
        <div class="form-link"><a href="/login.html">使用验证码登录 ›</a></div>
      </div>

      <div class="login-radio">
        <div>
          <input type="radio" id="readed" name="readed" v-model="radio" value="1">
          <label for="readed"></label>
        </div>
        <div>我已阅读并同意
          <a href="javascript:void(0)">《校园优购用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      form: {}
    },
    methods: {
      login() {
        if (!this.radio) {
          this.$message.error("请先确认阅读用户协议！");
          return;
        }
        axios.post("/user/login", this.form)
          .then(({data}) => {
            if (data) {
              sessionStorage.setItem("token", data);
            }
            location.href = "/info.html"
          })
          .catch(err => this.$message.error(err))
      },
      goBack() {
        history.back();
      }
    }
  })
</script>
</body>
</html>
